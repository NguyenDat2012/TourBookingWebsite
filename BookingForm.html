<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thông tin đặt tour - The Verdant Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="Styles/TPHCMTourDetails.css" rel="stylesheet"> <style>
        .form-container { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 50px; }
        .form-control { border-radius: 10px; padding: 12px; border: 1px solid #ddd; }
        .form-control:focus { border-color: var(--primary); box-shadow: none; }
    </style>
</head>
<body style="background-color: #f4f7f6;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="form-container">
                <h2 class="fw-bold mb-4" style="color: var(--primary);">Thông Tin Đặt Tour</h2>
                <form id="bookingForm">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Họ và Tên</label>
                            <input type="text" class="form-control" placeholder="Nguyễn Văn A" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số điện thoại</label>
                            <input type="tel" class="form-control" placeholder="090 123 4567" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Yêu cầu đặc biệt</label>
                            <textarea class="form-control" rows="3" placeholder="Ăn chay, dị ứng, đón tại khách sạn..."></textarea>
                        </div>
                        <div class="col-md-12 mt-4">
                            <div class="p-3 rounded-3" style="background: #eef2f7;">
                                <h6 class="fw-bold mb-1">Phương thức thanh toán</h6>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="payment" id="momo" checked>
                                    <label class="form-check-label" for="momo">Chuyển khoản / Ví điện tử</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="payment" id="cod">
                                    <label class="form-check-label" for="cod">Thanh toán tại văn phòng</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-3 mt-4 fs-5">Xác nhận đặt tour</button>
                    <a href="TPHCMTourDetails.html" class="d-block text-center mt-3 text-muted text-decoration-none">Quay lại chi tiết tour</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('bookingForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Cảm ơn ông! Thông tin đã được gửi. Chúng tôi sẽ liên hệ sớm nhất!');
        window.location.href = 'index.html'; // Quay về trang chủ sau khi xong
    };
</script>
</body>
</html>
